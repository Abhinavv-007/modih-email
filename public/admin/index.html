<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Modih Mail</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />

  <style>
    :root {
      --bg: #07070d;
      --glass: rgba(18, 14, 10, 0.75);
      --glass-border: rgba(255,255,255,0.09);
      --accent: #d4a76a;
      --accent-glow: rgba(212,167,106,0.3);
      --text: #fff;
      --text-2: rgba(255,255,255,0.78);
      --text-3: rgba(255,255,255,0.5);
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --radius: 14px;
      --shadow: 0 20px 60px rgba(0,0,0,0.5);
      --t: 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== BG ===== */
    .admin-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(212,167,106,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 100% 100%, rgba(100,80,180,0.05) 0%, transparent 60%);
    }
    .admin-bg-video {
      position: fixed; inset: 0; z-index: -1;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.08;
      filter: blur(2px);
      transform: translateZ(0);
    }
    .admin-overlay {
      position: fixed; inset: 0; z-index: 0;
      background: rgba(7,7,13,0.82);
    }

    /* ===== LAYOUT ===== */
    .admin-root { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ===== TOPBAR ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(10,8,6,0.8);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 0.6rem;
      text-decoration: none;
    }
    .topbar-brand span { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700; font-style: italic; background: linear-gradient(90deg,#FFD700,#F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .topbar-badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); background: rgba(212,167,106,0.12); border: 1px solid rgba(212,167,106,0.25); border-radius: 100px; padding: 0.2rem 0.65rem; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .topbar-status { font-size: 0.8rem; color: var(--text-3); display: flex; align-items: center; gap: 0.4rem; }
    .topbar-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px rgba(52,211,153,0.6); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .topbar-logout { font-size: 0.82rem; color: var(--text-3); background: none; border: 1px solid var(--glass-border); border-radius: 8px; padding: 0.4rem 0.9rem; cursor: pointer; font-family: inherit; transition: var(--t); }
    .topbar-logout:hover { color: var(--danger); border-color: rgba(248,113,113,0.35); }

    /* ===== GATEKEEPER ===== */
    .gate {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .gate-card {
      width: 100%; max-width: 400px;
      background: rgba(14,10,7,0.85);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 2.5rem;
      box-shadow: var(--shadow), 0 1px 0 rgba(255,255,255,0.04) inset;
      animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(28px) scale(0.96)} to{opacity:1;transform:none} }
    .gate-icon { font-size: 2.8rem; display: block; text-align: center; margin-bottom: 0.75rem; }
    .gate-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600; font-style: italic; text-align: center; margin-bottom: 0.4rem; }
    .gate-sub { font-size: 0.88rem; color: var(--text-3); text-align: center; margin-bottom: 1.75rem; }
    .gate-input { width: 100%; padding: 0.9rem 1.1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text); font-size: 1rem; font-family: inherit; outline: none; transition: var(--t); margin-bottom: 1rem; letter-spacing: 0.04em; }
    .gate-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .gate-btn { width: 100%; padding: 0.95rem; border-radius: 12px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; border: none; background: linear-gradient(135deg, rgba(212,167,106,0.95), rgba(200,149,106,0.9)); color: #0a0a0f; transition: var(--t); box-shadow: 0 4px 20px rgba(212,167,106,0.3); }
    .gate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(212,167,106,0.45); }
    .gate-error { display: none; padding: 0.7rem 1rem; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.22); border-radius: 10px; color: #fca5a5; font-size: 0.85rem; margin-top: 0.75rem; }
    .gate-error.visible { display: block; }

    /* ===== MAIN CONTENT ===== */
    .admin-main { flex: 1; padding: 2rem; max-width: 1300px; margin: 0 auto; width: 100%; }
    .admin-main.hidden { display: none; }

    /* ===== STATS ROW ===== */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card {
      background: rgba(18,14,10,0.7);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      transition: var(--t);
    }
    .stat-card:hover { border-color: rgba(212,167,106,0.25); transform: translateY(-2px); }
    .stat-card-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-3); margin-bottom: 0.4rem; }
    .stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 600; color: var(--accent); line-height: 1; }
    .stat-card-sub { font-size: 0.75rem; color: var(--text-3); margin-top: 0.25rem; }

    /* ===== CONTROLS ===== */
    .controls-row { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
    .search-input { flex: 1; min-width: 220px; padding: 0.7rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--text); font-size: 0.92rem; font-family: inherit; outline: none; transition: var(--t); }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .search-input::placeholder { color: var(--text-3); }
    .filter-btn { padding: 0.7rem 1.2rem; border-radius: 10px; font-size: 0.85rem; font-weight: 500; font-family: inherit; cursor: pointer; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--text-2); transition: var(--t); }
    .filter-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(212,167,106,0.1); }
    .refresh-btn { padding: 0.7rem 1rem; border-radius: 10px; font-size: 0.85rem; font-family: inherit; cursor: pointer; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--text-3); transition: var(--t); display: flex; align-items: center; gap: 0.4rem; }
    .refresh-btn:hover { color: var(--text-2); border-color: rgba(255,255,255,0.2); }

    /* ===== TABLE ===== */
    .table-wrap {
      background: rgba(14,10,7,0.6);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .table-head { display: grid; grid-template-columns: 1fr 130px 110px 120px 180px; gap: 0; padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--glass-border); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); }
    .user-row { display: grid; grid-template-columns: 1fr 130px 110px 120px 180px; gap: 0; padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.04); align-items: center; transition: var(--t); animation: rowIn 0.3s ease both; }
    @keyframes rowIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .user-row:last-child { border-bottom: none; }
    .user-row:hover { background: rgba(255,255,255,0.025); }
    .user-email { font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 1rem; color: var(--text); }
    .user-uid { font-size: 0.72rem; color: var(--text-3); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .plan-badge { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 100px; padding: 0.25rem 0.75rem; }
    .plan-badge.free { color: var(--text-3); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }
    .plan-badge.pro { color: var(--warning); background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.25); }
    .plan-badge.developer { color: #a78bfa; background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.25); }
    .plan-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .user-joined { font-size: 0.8rem; color: var(--text-3); }

    /* ===== ACTION BUTTONS ===== */
    .user-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .action-btn { padding: 0.3rem 0.7rem; border-radius: 7px; font-size: 0.72rem; font-weight: 600; font-family: inherit; cursor: pointer; border: 1px solid; transition: var(--t); letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
    .action-btn:active { transform: scale(0.95); }
    .action-pro { color: var(--warning); border-color: rgba(251,191,36,0.3); background: rgba(251,191,36,0.08); }
    .action-pro:hover { background: rgba(251,191,36,0.18); border-color: rgba(251,191,36,0.5); }
    .action-dev { color: #a78bfa; border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.08); }
    .action-dev:hover { background: rgba(167,139,250,0.18); border-color: rgba(167,139,250,0.5); }
    .action-down { color: var(--text-3); border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); }
    .action-down:hover { color: var(--text-2); border-color: rgba(255,255,255,0.25); }
    .action-del { color: var(--danger); border-color: rgba(248,113,113,0.25); background: rgba(248,113,113,0.06); }
    .action-del:hover { background: rgba(248,113,113,0.16); border-color: rgba(248,113,113,0.45); }

    /* ===== EMPTY / LOADING ===== */
    .table-empty { padding: 3rem 2rem; text-align: center; color: var(--text-3); font-size: 0.9rem; }
    .table-loading { padding: 2rem; text-align: center; color: var(--text-3); }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(18,14,10,0.95);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      padding: 0.7rem 1.5rem;
      font-size: 0.88rem;
      color: var(--text-2);
      z-index: 9999;
      white-space: nowrap;
      opacity: 0;
      animation: toastIn 0.3s ease forwards;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    @keyframes toastIn { to { opacity: 1; transform: translateX(-50%) translateY(-4px); } }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .table-head { display: none; }
      .user-row { grid-template-columns: 1fr; gap: 0.5rem; padding: 1.25rem 1rem; }
      .user-uid { display: none; }
      .user-actions { margin-top: 0.25rem; }
    }
    @media (max-width: 600px) {
      .admin-main { padding: 1rem; }
      .stats-row { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      .topbar { padding: 0.85rem 1rem; }
    }
  </style>
</head>
<body>

  <div class="admin-bg"></div>
  <video class="admin-bg-video" muted playsinline loop autoplay>
    <source src="/desktop-bg-loop.mp4" type="video/mp4" />
  </video>
  <div class="admin-overlay"></div>

  <div class="admin-root">

    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
      <a href="/" class="topbar-brand">
        <span>✉️</span>
        <span>modih.in</span>
      </a>
      <div class="topbar-right">
        <div class="topbar-status">
          <span class="topbar-dot"></span>
          <span id="live-status">Loading…</span>
        </div>
        <span class="topbar-badge">Admin</span>
        <button class="topbar-logout" id="logout-btn" onclick="handleLogout()" style="display:none">Lock 🔒</button>
      </div>
    </header>

    <!-- ===== GATE (password prompt) ===== -->
    <div class="gate" id="gate-view">
      <div class="gate-card">
        <span class="gate-icon">⚙️</span>
        <h1 class="gate-title">Admin <span style="background:linear-gradient(135deg,#d4a76a,#f5e6c8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Access</span></h1>
        <p class="gate-sub">Enter your admin secret to continue</p>
        <input type="password" class="gate-input" id="gate-secret" placeholder="Admin secret…" autocomplete="off" onkeydown="if(event.key==='Enter') unlockAdmin()" />
        <button class="gate-btn" onclick="unlockAdmin()">Unlock Dashboard</button>
        <div class="gate-error" id="gate-error">Incorrect secret. Please try again.</div>
      </div>
    </div>

    <!-- ===== ADMIN MAIN ===== -->
    <main class="admin-main hidden" id="admin-main">

      <!-- Stats -->
      <div class="stats-row" id="stats-row">
        <div class="stat-card">
          <div class="stat-card-label">Total Users</div>
          <div class="stat-card-value" id="stat-total">–</div>
          <div class="stat-card-sub">registered</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Free Plan</div>
          <div class="stat-card-value" id="stat-free" style="color:var(--text-3)">–</div>
          <div class="stat-card-sub">users</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Pro Plan</div>
          <div class="stat-card-value" id="stat-pro" style="color:var(--warning)">–</div>
          <div class="stat-card-sub">subscribers</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">Developer</div>
          <div class="stat-card-value" id="stat-dev" style="color:#a78bfa">–</div>
          <div class="stat-card-sub">API users</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-row">
        <input type="search" class="search-input" id="search-input" placeholder="Search by email…" oninput="handleSearch(this.value)" />
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" data-filter="subscribed" onclick="setFilter('subscribed', this)">Subscribed</button>
        <button class="refresh-btn" onclick="loadUsers()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          Refresh
        </button>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <div class="table-head">
          <div>User / Email</div>
          <div>UID</div>
          <div>Plan</div>
          <div>Joined</div>
          <div>Actions</div>
        </div>
        <div id="users-body">
          <div class="table-loading"><span class="spin">⟳</span> Loading users…</div>
        </div>
      </div>

    </main>

  </div>

  <!-- Toast container -->
  <div id="toast-el" style="display:none"></div>

  <script>
    // ===== STATE =====
    let adminSecret = '';
    let allUsers = [];
    let currentFilter = 'all';
    let searchTimeout = null;

    // ===== GATE =====
    async function unlockAdmin() {
      const input = document.getElementById('gate-secret');
      const errEl = document.getElementById('gate-error');
      const secret = input.value.trim();
      if (!secret) return;

      errEl.classList.remove('visible');
      // Test by making a real API call
      try {
        const res = await fetch('/api/admin/users?limit=1', {
          headers: { 'X-Admin-Secret': secret }
        });
        if (res.status === 401) {
          errEl.classList.add('visible');
          input.value = '';
          return;
        }
        if (res.ok) {
          adminSecret = secret;
          document.getElementById('gate-view').style.display = 'none';
          document.getElementById('admin-main').classList.remove('hidden');
          document.getElementById('logout-btn').style.display = 'block';
          await loadUsers();
        }
      } catch (e) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.add('visible');
      }
    }

    function handleLogout() {
      adminSecret = '';
      allUsers = [];
      document.getElementById('gate-view').style.display = 'flex';
      document.getElementById('admin-main').classList.add('hidden');
      document.getElementById('logout-btn').style.display = 'none';
      document.getElementById('gate-secret').value = '';
      document.getElementById('gate-error').classList.remove('visible');
    }

    // ===== LOAD USERS =====
    async function loadUsers(filter, emailSearch) {
      const body = document.getElementById('users-body');
      const liveStatus = document.getElementById('live-status');
      body.innerHTML = '<div class="table-loading"><span class="spin">⟳</span> Loading users…</div>';
      liveStatus.textContent = 'Loading…';

      let url = '/api/admin/users';
      const params = new URLSearchParams();
      if (filter && filter !== 'all') params.set('filter', filter);
      if (emailSearch) params.set('email', emailSearch);
      if ([...params].length) url += '?' + params.toString();

      try {
        const res = await fetch(url, { headers: { 'X-Admin-Secret': adminSecret } });
        if (!res.ok) { body.innerHTML = '<div class="table-empty">Failed to load users.</div>'; return; }
        const data = await res.json();
        allUsers = data.users || [];
        renderUsers(allUsers);
        updateStats(data.stats || {});
        liveStatus.textContent = `${allUsers.length} users loaded`;
      } catch (e) {
        body.innerHTML = '<div class="table-empty">Network error. Please refresh.</div>';
        liveStatus.textContent = 'Error';
      }
    }

    function renderUsers(users) {
      const body = document.getElementById('users-body');
      if (users.length === 0) {
        body.innerHTML = '<div class="table-empty">No users found.</div>';
        return;
      }
      body.innerHTML = users.map((u, i) => `
        <div class="user-row" style="animation-delay:${i * 0.03}s">
          <div>
            <div class="user-email">${escHtml(u.email)}</div>
            <div class="user-uid">${escHtml(u.uid)}</div>
          </div>
          <div class="user-uid" style="font-size:.72rem;">${escHtml(u.uid?.slice(0,12))}…</div>
          <div>
            <span class="plan-badge ${u.plan}">
              <span class="plan-badge-dot"></span>
              ${u.plan}
            </span>
          </div>
          <div class="user-joined">${formatDate(u.created_at)}</div>
          <div class="user-actions">
            ${u.plan !== 'pro' ? `<button class="action-btn action-pro" onclick="updatePlan('${u.uid}','pro')">Pro</button>` : ''}
            ${u.plan !== 'developer' ? `<button class="action-btn action-dev" onclick="updatePlan('${u.uid}','developer')">Dev</button>` : ''}
            ${u.plan !== 'free' ? `<button class="action-btn action-down" onclick="updatePlan('${u.uid}','free')">↓ Free</button>` : ''}
            <button class="action-btn action-del" onclick="deleteUser('${u.uid}','${escHtml(u.email)}')">Del</button>
          </div>
        </div>
      `).join('');
    }

    function updateStats(stats) {
      document.getElementById('stat-total').textContent = stats.total ?? '–';
      document.getElementById('stat-free').textContent = stats.free ?? '–';
      document.getElementById('stat-pro').textContent = stats.pro ?? '–';
      document.getElementById('stat-dev').textContent = stats.developer ?? '–';
      document.getElementById('live-status').textContent = 'Live';
    }

    // ===== FILTER =====
    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const search = document.getElementById('search-input').value.trim();
      loadUsers(filter, search || undefined);
    }

    function handleSearch(val) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        loadUsers(currentFilter !== 'all' ? currentFilter : undefined, val.trim() || undefined);
      }, 400);
    }

    // ===== UPDATE PLAN =====
    async function updatePlan(uid, plan) {
      try {
        const res = await fetch('/api/admin/users', {
          method: 'PATCH',
          headers: { 'X-Admin-Secret': adminSecret, 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid, plan })
        });
        if (res.ok) {
          showToast(`✅ Plan updated to "${plan}"`);
          loadUsers(currentFilter !== 'all' ? currentFilter : undefined);
        } else {
          const d = await res.json().catch(() => ({}));
          showToast('❌ ' + (d.error || 'Failed to update plan'));
        }
      } catch (e) {
        showToast('❌ Network error');
      }
    }

    // ===== DELETE USER =====
    async function deleteUser(uid, email) {
      if (!confirm(`Delete user ${email}?\n\nThis removes their subscription record permanently.`)) return;
      try {
        const res = await fetch(`/api/admin/users?uid=${encodeURIComponent(uid)}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Secret': adminSecret }
        });
        if (res.ok) {
          showToast('🗑️ User deleted');
          loadUsers(currentFilter !== 'all' ? currentFilter : undefined);
        } else {
          showToast('❌ Failed to delete user');
        }
      } catch (e) {
        showToast('❌ Network error');
      }
    }

    // ===== UTILS =====
    function formatDate(ts) {
      if (!ts) return '–';
      return new Date(ts * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escHtml(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let toastTimeout;
    function showToast(msg) {
      clearTimeout(toastTimeout);
      const el = document.getElementById('toast-el');
      el.style.display = 'none';
      el.offsetHeight;
      el.className = 'toast';
      el.textContent = msg;
      el.style.display = 'block';
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = 'toastIn 0.3s ease forwards';
      toastTimeout = setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    // ===== ENTER KEY for gate =====
    document.getElementById('gate-secret')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') unlockAdmin();
    });
  </script>
</body>
</html>
