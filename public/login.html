<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Modih Mail</title>
  <meta name="description" content="Sign in to your Modih Mail account." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/auth.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>" />
</head>
<body>

  <!-- ========== BACKGROUND ========== -->
  <div class="auth-bg">
    <video muted playsinline loop autoplay preload="auto" poster="/deskton-mail-bg.png" id="auth-video">
      <source src="/desktop-bg-loop.mp4" type="video/mp4" />
    </video>
    <div class="bg-overlay"></div>
  </div>

  <!-- ========== NAV ========== -->
  <nav class="auth-nav">
    <div class="auth-nav-inner">
      <a href="/" class="auth-nav-brand">
        <span style="font-size:1.6rem; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))">✉️</span>
        <span class="auth-brand-text">modih.in</span>
      </a>
      <a href="/signup.html" class="auth-nav-link">Sign Up</a>
    </div>
  </nav>

  <!-- ========== AUTH PAGE ========== -->
  <main class="auth-page">
    <div class="auth-card">

      <!-- Header -->
      <div class="auth-header">
        <span class="auth-icon">🔒</span>
        <h1 class="auth-title">Welcome <span class="accent">back</span></h1>
        <p class="auth-subtitle">Sign in to manage your premium inbox</p>
      </div>

      <!-- Plan badge (shown when redirected from pricing) -->
      <div id="plan-badge" style="text-align:center; display:none; margin-bottom:1rem;">
        <span class="auth-plan-badge">
          <span class="dot"></span>
          <span id="plan-badge-text"></span>
        </span>
      </div>

      <!-- OAuth Buttons -->
      <div class="oauth-group">
        <button class="oauth-btn" id="btn-google" onclick="signInGoogle()">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
        <button class="oauth-btn" id="btn-github" onclick="signInGitHub()">
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
          Continue with GitHub
        </button>
      </div>

      <!-- Divider -->
      <div class="auth-divider"><span>or</span></div>

      <!-- Email Form -->
      <form class="auth-form" id="login-form" onsubmit="signInEmail(event)">
        <div class="auth-field">
          <label class="auth-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="auth-input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="login-password">Password</label>
          <div class="auth-input-wrap">
            <input type="password" id="login-password" class="auth-input" placeholder="Your password" required autocomplete="current-password" />
            <button type="button" class="auth-password-toggle" id="toggle-pw" onclick="togglePassword()" aria-label="Show/hide password">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div style="text-align: right; margin-top: 0.5rem;">
            <a href="#" onclick="handleForgotPassword(event)" style="font-size: 0.75rem; color: var(--text-3); text-decoration: none; transition: 0.2s;">Forgot password?</a>
          </div>
        </div>

        <div class="auth-error" id="login-error"></div>

        <button type="submit" class="auth-submit" id="login-btn">Sign In</button>

        <div style="text-align:center; margin-top:1rem;">
          <button type="button" onclick="signInMagicLink()" style="background:none;border:none;color:var(--text-muted);font-size:0.82rem;cursor:pointer;text-decoration:underline;font-family:inherit;">Sign in with email link instead</button>
        </div>
      </form>

      <!-- Verification warning (shown if email not verified) -->
      <div class="auth-success" id="verify-warning" style="display:none; margin-top:1rem;">
        ✉️ Please verify your email first. <a href="#" onclick="resendVerification(); return false;" style="color:var(--accent); text-decoration:none;">Resend email</a>
      </div>

      <!-- Footer -->
      <p class="auth-footer-link">
        Don't have an account? <a href="/signup.html" id="signup-link">Sign up free</a>
      </p>

      <p class="auth-note">
        Free tier requires no account. Sign in only needed for Pro & Developer plans.
      </p>

    </div>
  </main>

  <!-- Firebase SDK (compat for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    // ========== FIREBASE INIT ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDzUpWLWZDn20MlacZHjeBXDe8yyI1QSp4",
      authDomain: "modih-mail.firebaseapp.com",
      projectId: "modih-mail",
      storageBucket: "modih-mail.firebasestorage.app",
      messagingSenderId: "333202273259",
      appId: "1:333202273259:web:279c458fa1c57b99d81fae",
      measurementId: "G-TC5Y6S67ZC"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Redirect destination from query param
    const params = new URLSearchParams(location.search);
    const redirectTo = params.get('redirect') || '/';
    const plan = params.get('plan');

    if (plan) {
      const badge = document.getElementById('plan-badge');
      const text = document.getElementById('plan-badge-text');
      badge.style.display = 'block';
      text.textContent = plan === 'pro' ? '⭐ Upgrading to Pro' : '🔑 Upgrading to Developer';
      // Carry plan param to signup link
      document.getElementById('signup-link').href = `/signup.html?plan=${plan}&redirect=${encodeURIComponent(redirectTo)}`;
    }

    // If already logged in, redirect
    auth.onAuthStateChanged(async (user) => {
      if (user && user.emailVerified) {
        window.location.replace(redirectTo);
      }
    });

    // ========== PASSWORD TOGGLE ==========
    let pwVisible = false;
    function togglePassword() {
      pwVisible = !pwVisible;
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      input.type = pwVisible ? 'text' : 'password';
      icon.innerHTML = pwVisible
        ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }

    // ========== EMAIL SIGN IN ==========
    async function signInEmail(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      const verifyEl = document.getElementById('verify-warning');

      errEl.classList.remove('visible');
      verifyEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spin">⟳</span> Signing in…';

      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        if (!cred.user.emailVerified) {
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
          verifyEl.style.display = 'block';
          window._unverifiedUser = cred.user;
          await auth.signOut();
          return;
        }
        // Success — sync plan to backend
        await syncUserPlan(cred.user);
        window.location.replace(redirectTo);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
        errEl.textContent = friendlyError(err.code);
        errEl.classList.add('visible');
      }
    }

    // ========== FORGOT PASSWORD ==========
    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.classList.remove('visible');

      if (!email) {
        errEl.textContent = 'Please enter your email address first.';
        errEl.classList.add('visible');
        document.getElementById('login-email').focus();
        return;
      }

      btn.disabled = true;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="spin">⟳</span> Sending...';

      try {
        await auth.sendPasswordResetEmail(email);
        btn.innerHTML = 'Reset link sent ✓';
        btn.style.background = 'transparent';
        btn.style.border = '1px solid #34d399';
        btn.style.color = '#34d399';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.background = '';
          btn.style.border = '';
          btn.style.color = '';
          btn.disabled = false;
        }, 3000);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        errEl.textContent = friendlyError(err.code) || err.message;
        errEl.classList.add('visible');
      }
    }

    // ========== MAGIC LINK SIGN IN ==========
    async function signInMagicLink() {
      const email = document.getElementById('login-email').value.trim();
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.classList.remove('visible');

      if (!email) {
        errEl.textContent = 'Please enter your email address first.';
        errEl.classList.add('visible');
        document.getElementById('login-email').focus();
        return;
      }

      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spin">⟳</span> Sending link...';

      const actionCodeSettings = {
        url: window.location.origin + '/login.html?emailLink=1&redirect=' + encodeURIComponent(redirectTo),
        handleCodeInApp: true,
      };

      try {
        await auth.sendSignInLinkToEmail(email, actionCodeSettings);
        window.localStorage.setItem('emailForSignIn', email);
        btn.innerHTML = 'Link sent to ' + email + ' ✓';
        btn.style.background = 'transparent';
        btn.style.border = '1px solid #34d399';
        btn.style.color = '#34d399';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.background = '';
          btn.style.border = '';
          btn.style.color = '';
          btn.disabled = false;
        }, 4000);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        errEl.textContent = friendlyError(err.code) || err.message;
        errEl.classList.add('visible');
      }
    }

    // ========== HANDLE MAGIC LINK COMPLETION (on page load) ==========
    if (auth.isSignInWithEmailLink(window.location.href)) {
      let email = window.localStorage.getItem('emailForSignIn');
      if (!email) {
        email = window.prompt('Please confirm your email address:');
      }
      if (email) {
        auth.signInWithEmailLink(email, window.location.href)
          .then(async (cred) => {
            window.localStorage.removeItem('emailForSignIn');
            await syncUserPlan(cred.user);
            window.location.replace(redirectTo);
          })
          .catch((err) => {
            const errEl = document.getElementById('login-error');
            errEl.textContent = 'Magic link sign-in failed: ' + friendlyError(err.code);
            errEl.classList.add('visible');
          });
      }
    }

    // ========== GOOGLE SIGN IN ==========
    async function signInGoogle() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const cred = await auth.signInWithPopup(provider);
        await syncUserPlan(cred.user);
        window.location.replace(redirectTo);
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          showError(friendlyError(err.code));
        }
      }
    }

    // ========== GITHUB SIGN IN ==========
    async function signInGitHub() {
      try {
        const provider = new firebase.auth.GithubAuthProvider();
        const cred = await auth.signInWithPopup(provider);
        await syncUserPlan(cred.user);
        window.location.replace(redirectTo);
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          showError(friendlyError(err.code));
        }
      }
    }

    // ========== SYNC USER TO BACKEND ==========
    async function syncUserPlan(user) {
      try {
        const token = await user.getIdToken();
        await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
      } catch (e) {
        console.error('Backend sync error:', e);
      }
    }

    // ========== RESEND VERIFICATION ==========
    async function resendVerification() {
      if (window._unverifiedUser) {
        await window._unverifiedUser.sendEmailVerification();
        document.getElementById('verify-warning').innerHTML = '✅ Verification email sent! Check your inbox.';
      }
    }

    // ========== ERROR HELPER ==========
    function showError(msg) {
      const errEl = document.getElementById('login-error');
      errEl.textContent = msg;
      errEl.classList.add('visible');
    }

    function friendlyError(code) {
      const map = {
        'auth/user-not-found': 'No account found with that email.',
        'auth/wrong-password': 'Incorrect password. Try again.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/too-many-requests': 'Too many attempts. Please wait a moment.',
        'auth/user-disabled': 'This account has been disabled.',
        'auth/network-request-failed': 'Network error — check your connection.',
        'auth/popup-blocked': 'Popup blocked by browser. Please allow popups.',
        'auth/account-exists-with-different-credential': 'An account with this email already exists. Try a different sign-in method.',
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    // ========== VIDEO AUTOPLAY FALLBACK ==========
    const video = document.getElementById('auth-video');
    if (video) {
      video.play().catch(() => {
        document.addEventListener('click', () => video.play().catch(()=>{}), { once: true });
      });
    }
  </script>
</body>
</html>
